# Prometheus configuration.
#
# Primary metrics path is OTLP -> OTel Collector -> Prometheus: Prometheus
# scrapes the collector's Prometheus-exposition endpoint (:8889). It does NOT
# scrape the Python worker directly.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8889]

  # The collector's own internal telemetry (pipeline health, dropped points).
  - job_name: otel-collector-internal
    static_configs:
      - targets: [otel-collector:8888]
