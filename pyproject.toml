[project]
name = "temporal-langgraph-agent"
version = "0.1.0"
description = "Reference application integrating Temporal, LangGraph, and OpenTelemetry with a config-driven runtime."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "temporalio>=1.33.0",
    "langgraph>=0.6",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "click>=8.1",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "openinference-instrumentation-langchain>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
